[project]
name = "novel-craft"
version = "1.1.0"
description = "AI Novel Writing Multi-Agent System - PoC"
authors = [
    { name = "NovelCraft Team" }
]
readme = "README.md"
requires-python = ">=3.11,<3.13"

# ====== 核心依赖（生产代码） ======
dependencies = [
    # --- LLM / Agent 框架 ---
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-anthropic>=1.0.0",
    # --- Web 框架 ---
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2",
    # --- 缓存 / LangGraph Checkpointer ---
    "redis>=5.0.4",
    "langgraph-checkpoint-redis>=0.5.0",
    # --- 工具与可靠性 ---
    "tenacity>=8.3.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.0",
    "alembic>=1.19.1",
    # --- 数据库 ---
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    # --- 向量数据库 ---
    "qdrant-client>=1.9.0",
    # --- JWT Auth ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",
]

# ====== 可选依赖（按需安装） ======
[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

# ====== ruff 配置（编码规范） ======
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PT",  # pytest style
    "RUF", # ruff-specific
    "TID", # tid check
]
ignore = [
    "E501",  # line-too-long（与 line-length 配合）
    "B008",  # function call in default argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"docs/**/*.py" = ["E402"]

# ====== pytest 配置 ======
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (require Docker services)",
    "e2e: end-to-end tests",
]

# ====== mypy 配置 ======
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
