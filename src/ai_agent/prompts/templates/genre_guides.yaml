# Genre Style Guides
name: genre_style_guides
version: 1
description: 各题材风格指南
content:
  仙侠: |
    文风：古风典雅，善用成语典故
    修炼体系：炼气→筑基→金丹→元婴→化神
    常用元素：灵兽、法宝、丹药、阵法
    节奏：压抑中爆发，修炼突破循环
    禁用词：笑嘻嘻、美滋滋

  修仙: |
    文风：古典仙侠风格
    修炼体系：练气期→筑基期→金丹期→元婴期→化神期→大乘期→渡劫期
    常用元素：天材地宝、秘境、传承、宗门
    节奏：循序渐进，注重机缘造化
    特色：凡人流、废柴逆袭

  奇幻: |
    文风：史诗感强，世界观宏大
    魔法体系：元素魔法、契约魔法、炼金术
    常用元素：龙族、精灵、矮人、兽人、魔法学院
    节奏：冒险与战斗交织
    特色：史诗战争、位面穿梭

  悬疑: |
    文风：简洁紧凑，逻辑严密
    元素：推理、惊悚、谍战、刑侦
    节奏：每章末尾设置悬念
    特色：伏笔埋设、逆转结局
    禁用词：突然、没想到

  言情: |
    文风：细腻柔情，情景交融
    元素：甜宠、虐恋、霸道总裁、青梅竹马
    节奏：情感递进，误会与和解
    特色：多角恋、门第观念

  科幻: |
    文风：冷静理性，科技感强
    元素：星际航行、人工智能、赛博朋克、末日危机
    节奏：快节奏、高密度信息
    特色：硬科幻、软科幻
